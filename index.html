<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pong Roguelike 3D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2304040c'/%3E%3Crect x='4' y='9' width='4' height='14' rx='1' fill='%232de2e6'/%3E%3Crect x='24' y='9' width='4' height='14' rx='1' fill='%23ff3d81'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23fff'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="wrap"><canvas id="g"></canvas><canvas id="c" tabindex="0"></canvas>
  <div id="ui">
    <div id="menu">
      <div class="col" id="mainBox">
        <button class="btn" id="bLocal">▶ JUGAR LOCAL</button>
        <div class="note">Un teclado para dos, o un celular en horizontal: cada mitad de la pantalla controla a un jugador.</div>
        <button class="btn pink" id="bHost">🌐 CREAR SALA ONLINE</button>
        <div class="row"><input id="code" maxlength="4" placeholder="CÓDIGO" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="btn pink" id="bJoin">UNIRSE</button></div>
        <div class="msg" id="mmsg"></div>
        <div class="note" id="onote"></div>
      </div>
      <div class="col" id="waitBox" style="display:none">
        <div class="note">CÓDIGO DE LA SALA</div>
        <div id="bigcode">----</div>
        <div id="mstatus"></div>
        <button class="btn small" id="bCancel">CANCELAR</button>
      </div>
    </div>
    <div id="kp"><div id="kpt">Escribe el código de la sala</div><div id="kpcode">____</div><div id="kgrid"></div>
      <div class="kbar"><button id="kDel">⌫ BORRAR</button><button id="kClose">CANCELAR</button><button id="kOk">UNIRSE</button></div></div>
    <button class="ab" id="ab0"></button>
    <button class="ab" id="ab1"></button>
    <button id="bExit">✕ MENÚ</button>
  </div>
</div>
<div id="rot"><div class="big">📱↻</div><div>GIRA EL CELULAR<br>PARA JUGAR EN HORIZONTAL</div><button id="bRot">jugar así igual</button></div>
<script src="js/core/config.js"></script>
<script src="js/core/utils.js"></script>
<script src="js/core/dom.js"></script>
<script src="js/data/cards.js"></script>
<script src="js/data/modifiers.js"></script>
<script src="js/data/events.js"></script>
<script src="js/core/state.js"></script>
<script src="js/systems/audio.js"></script>
<script src="js/systems/input.js"></script>
<script src="js/systems/fx.js"></script>
<script src="js/game/camera-events.js"></script>
<script src="js/game/player.js"></script>
<script src="js/game/abilities.js"></script>
<script src="js/game/ball.js"></script>
<script src="js/game/match.js"></script>
<script src="js/net/peer-room.js"></script>
<script src="js/net/netcode.js"></script>
<script src="js/net/lobby.js"></script>
<script src="js/ui/menu.js"></script>
<script src="js/render/draw-utils.js"></script>
<script src="js/render/hud.js"></script>
<script src="js/render/screens.js"></script>
<script src="js/render/overlay.js"></script>
<script src="js/render/scene3d.js"></script>
<script src="js/main.js"></script>
</body>
</html>
