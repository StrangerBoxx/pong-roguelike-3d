<style>
  html,body{margin:0;height:100%;background:#04040c;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;border-radius:8px;overflow:hidden;box-shadow:0 0 50px #2de2e622,0 0 90px #ff3d811a}
  canvas{display:block;position:absolute;left:0;top:0;outline:none;touch-action:none}
  body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #ui{position:absolute;inset:0;pointer-events:none;font-family:'VT323',monospace;color:#e8e8ff;--u:1}
  #ui button,#ui input{pointer-events:auto;font-family:'Press Start 2P',monospace}
  #menu{position:absolute;left:50%;top:36%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;width:calc(var(--u)*520px)}
  .col{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*10px);width:100%}
  .btn{width:100%;padding:calc(var(--u)*14px);font-size:calc(var(--u)*13px);color:#fff;background:rgba(20,20,50,.88);border:2px solid #2de2e6;border-radius:calc(var(--u)*10px);cursor:pointer;box-shadow:0 0 14px #2de2e655}
  .btn:hover{background:rgba(45,226,230,.18)}

  .btn.small{width:auto;font-size:calc(var(--u)*10px);padding:calc(var(--u)*10px) calc(var(--u)*16px);border-color:#555a90;box-shadow:none}
  .row{display:flex;gap:calc(var(--u)*10px);width:100%}
  .row .btn{width:auto;flex:0 0 auto}
  #code{flex:1;min-width:0;text-transform:uppercase;text-align:center;font-size:calc(var(--u)*16px);padding:calc(var(--u)*10px);background:rgba(10,10,30,.92);color:#ffe66d;border:2px solid #ff3d81;border-radius:calc(var(--u)*10px);letter-spacing:.3em;outline:none}
  .note{font-size:calc(var(--u)*19px);text-align:center;color:#a9afd8;line-height:1.05}
  .msg{font-size:calc(var(--u)*21px);text-align:center;color:#ffb27a;min-height:1em;line-height:1.05}
  #bigcode{font-family:'Press Start 2P',monospace;font-size:calc(var(--u)*38px);color:#ffe66d;letter-spacing:.25em;text-shadow:0 0 16px #ffe66d;margin:calc(var(--u)*6px) 0}
  #mstatus{font-size:calc(var(--u)*23px);text-align:center;color:#e8e8ff;line-height:1.1}
  .ab{position:absolute;bottom:calc(var(--u)*78px);width:calc(var(--u)*100px);height:calc(var(--u)*100px);border-radius:50%;font-size:calc(var(--u)*34px)!important;font-family:sans-serif!important;background:rgba(255,255,255,.07);border:3px solid;display:none;color:#fff;touch-action:none}
  #ab0{left:calc(var(--u)*22px);border-color:#2de2e6}
  #ab1{right:calc(var(--u)*22px);border-color:#ff3d81}
  #bExit{position:absolute;left:calc(var(--u)*10px);top:calc(var(--u)*10px);font-size:calc(var(--u)*9px);padding:calc(var(--u)*7px) calc(var(--u)*10px);background:rgba(20,20,50,.75);color:#c8ccf0;border:1px solid #555a90;border-radius:6px;display:none;cursor:pointer}
  #rot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#04040c;color:#fff;font-family:'Press Start 2P',monospace;font-size:13px;line-height:1.8;text-align:center;z-index:9;gap:22px;padding:24px}
  #rot .big{font-size:56px}
  #rot button{font-family:'VT323',monospace;font-size:22px;background:none;color:#a9afd8;border:1px solid #555a90;border-radius:8px;padding:8px 16px}
  @media (orientation:portrait) and (pointer:coarse){#rot:not(.off){display:flex}}
  #code{-webkit-user-select:text;user-select:text;touch-action:manipulation;cursor:pointer}
  #kp{display:none;position:absolute;inset:0;background:rgba(4,4,14,.95);flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*14px);pointer-events:auto;z-index:5}
  #kpcode{font-family:'Press Start 2P',monospace;font-size:calc(var(--u)*34px);color:#ffe66d;letter-spacing:.35em;text-shadow:0 0 14px #ffe66d}
  #kpt{font-size:calc(var(--u)*22px);color:#a9afd8}
  #kgrid{display:grid;grid-template-columns:repeat(11,1fr);gap:calc(var(--u)*8px)}
  #kgrid button,.kbar button{pointer-events:auto;font-family:'Press Start 2P',monospace;font-size:calc(var(--u)*18px);color:#fff;background:rgba(30,30,70,.95);border:2px solid #555a90;border-radius:calc(var(--u)*8px);min-width:calc(var(--u)*62px);height:calc(var(--u)*62px);touch-action:manipulation}
  #kgrid button:active,.kbar button:active{background:#ff3d81;border-color:#ff3d81}
  .kbar{display:flex;gap:calc(var(--u)*12px)}
  .kbar button{padding:0 calc(var(--u)*20px);font-size:calc(var(--u)*13px)}
  .kbar #kOk{border-color:#ff3d81;box-shadow:0 0 12px #ff3d8155}
</style>

<body>
<div id="wrap"><canvas id="g"></canvas><canvas id="c" tabindex="0"></canvas>
  <div id="ui">
    <div id="menu">
      <div class="col" id="mainBox">
        <button class="btn" id="bLocal">▶ JUGAR LOCAL</button>
        <div class="note">Un teclado para dos, o un celular en horizontal: cada mitad de la pantalla controla a un jugador.</div>
        <button class="btn pink" id="bHost">🌐 CREAR SALA ONLINE</button>
        <div class="row"><input id="code" maxlength="4" placeholder="CÓDIGO" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="btn pink" id="bJoin">UNIRSE</button></div>
        <div class="msg" id="mmsg"></div>

      </div>

      <div class="kbar"><button id="kDel">⌫ BORRAR</button><button id="kClose">CANCELAR</button><button id="kOk">UNIRSE</button></div></div>

</div>
<div id="rot"><div class="big">📱↻</div><div>GIRA EL CELULAR<br>PARA JUGAR EN HORIZONTAL</div><button id="bRot">jugar así igual</button></div>
<script>
(() => {
'use strict';
const W = 960, H = 600, POINTS = 3, ROUNDS = 4;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let K = 1;
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H) * 0.98;
  const d = window.devicePixelRatio || 1;
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  const wr = document.getElementById('wrap'); wr.style.width = W * s + 'px'; wr.style.height = H * s + 'px';
  document.getElementById('ui').style.setProperty('--u', s);
  if (R3) R3.resize(W * s, H * s);
  cv.width = Math.round(W * s * d); cv.height = Math.round(H * s * d);
  K = cv.width / W;
}
addEventListener('resize', resize);
let R3 = null;

/* ---------- input ---------- */
const keys = new Set(), pressed = new Set();
addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter'].includes(e.code)) e.preventDefault();
  if (!e.repeat) pressed.add(e.code);
  keys.add(e.code); initAudio();
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
let isTouch = false;
try { isTouch = matchMedia('(pointer: coarse)').matches; } catch (e) {}
const drags = new Map(), touchTarget = [null, null], touchAct = [false, false], tapSel = [null, null];
let draftRects = [[], []];
function toGame(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
cv.addEventListener('pointerdown', e => {
  cv.focus(); initAudio();
  if (e.pointerType === 'touch') isTouch = true;
  const g = toGame(e);
  if (state === 'title') return;
  if (state === 'matchEnd') { if (NET.mode !== 'guest') pressed.add('Space'); return; }
  if (state === 'draft') {
    const pids = NET.mode === 'local' ? [0, 1] : [NET.me];
    for (const i of pids) (draftRects[i] || []).forEach((r, k) => {
      if (g.x >= r.x && g.x <= r.x + r.w && g.y >= r.y && g.y <= r.y + r.h) tapSel[i] = k;
    });
    return;
  }
  const pid = NET.mode === 'local' ? (g.x < W / 2 ? 0 : 1) : NET.me;
  if (!P[pid]) return;
  drags.set(e.pointerId, { pid, sy: g.y, py: P[pid].y });
  try { cv.setPointerCapture(e.pointerId); } catch (er) {}
});
cv.addEventListener('pointermove', e => {
  const d = drags.get(e.pointerId); if (!d) return;
  const g = toGame(e);
  touchTarget[d.pid] = clamp(d.py + (g.y - d.sy) * 1.6, 0, H);
});
function endDrag(e) {
  const d = drags.get(e.pointerId); if (!d) return;
  drags.delete(e.pointerId);
  if (![...drags.values()].some(o => o.pid === d.pid)) touchTarget[d.pid] = null;
}
cv.addEventListener('pointerup', endDrag); cv.addEventListener('pointercancel', endDrag);
const IN = [0, 1].map(() => ({ dir: 0, target: null, act: false, up: false, down: false }));
const CTRL = [
  { up: ['KeyW'], down: ['KeyS'], act: ['KeyD'], keyName: 'D' },
  { up: ['ArrowUp'], down: ['ArrowDown'], act: ['ArrowLeft', 'Enter'], keyName: '←' },
];
const any = (set, list) => list.some(k => set.has(k));
function gatherInput() {
  for (const o of IN) { o.dir = 0; o.target = null; o.act = false; o.up = false; o.down = false; }
  const ctl = (i, c) => {
    const o = IN[i];
    o.dir += (any(keys, c.down) ? 1 : 0) - (any(keys, c.up) ? 1 : 0);
    if (any(pressed, c.act)) o.act = true;
    if (any(pressed, c.up)) o.up = true;
    if (any(pressed, c.down)) o.down = true;
  };
  if (NET.mode === 'local') { ctl(0, CTRL[0]); ctl(1, CTRL[1]); }
  else { ctl(NET.me, CTRL[0]); ctl(NET.me, CTRL[1]); if (pressed.has('Space')) IN[NET.me].act = true; }
  for (let i = 0; i < 2; i++) {
    IN[i].dir = clamp(IN[i].dir, -1, 1);
    if (touchTarget[i] != null && !IN[i].dir) IN[i].target = touchTarget[i];
    if (touchAct[i]) { IN[i].act = true; touchAct[i] = false; }
  }
}

/* ---------- audio ---------- */
let AC = null, muted = false;
function initAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume().catch(() => {});
}
function beep(f, d = 0.08, type = 'square', v = 0.05, slide = 0) {
  fxRec(['s', f, d, type, v, slide]);
  if (!AC || muted) return;
  try {
    const o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t0 + d);
    g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + d + 0.02);
  } catch (e) {}
}

/* ---------- data ---------- */
const RAR = [
  { name: 'COMÚN', color: '#9fb3c8', w: 60 },
  { name: 'RARA', color: '#4da3ff', w: 30 },
  { name: 'ÉPICA', color: '#c77dff', w: 12 },
];
const CARDS = [
  { id: 'long',   icon: '📏', name: 'Paleta XL',    rar: 0, max: 4, desc: '+22% de tamaño de paleta.' },
  { id: 'fast',   icon: '⚡', name: 'Turbo',        rar: 0, max: 4, desc: '+18% de velocidad de paleta.' },
  { id: 'power',  icon: '💥', name: 'Golpe fuerte', rar: 0, max: 4, desc: 'Tus golpes aceleran más la bola.' },
  { id: 'spin',   icon: '🌀', name: 'Efecto',       rar: 0, max: 3, desc: 'Mover la paleta al golpear curva la bola.' },
  { id: 'shrink', icon: '🧿', name: 'Maldición',    rar: 1, max: 3, desc: 'La paleta rival se encoge un 12%.' },
  { id: 'shield', icon: '🛡️', name: 'Escudo',       rar: 1, max: 3, desc: 'Bloquea 1 gol en tu contra por ronda.' },
  { id: 'magnet', icon: '🧲', name: 'Imán',         rar: 1, max: 3, desc: 'La bola se desvía hacia tu paleta.' },
  { id: 'ghost',  icon: '👻', name: 'Fantasma',     rar: 1, max: 3, desc: 'Tras tu golpe, la bola es invisible en el centro.' },
  { id: 'cool',   icon: '⏱️', name: 'Recarga',      rar: 1, max: 2, desc: 'Tu habilidad se recarga un 25% más rápido.' },
  { id: 'multi',  icon: '🧬', name: 'Mitosis',      rar: 2, max: 3, desc: '20% de probabilidad de dividir la bola al golpear.' },
  { id: 'twin',   icon: '👯', name: 'Gemela',       rar: 2, max: 1, desc: 'Una mini-paleta espejo defiende tu mitad.' },
  { id: 'crit',   icon: '🎯', name: 'Crítico',      rar: 2, max: 2, desc: '25% de que tus goles valgan doble.' },
  { id: 'a_dash',   icon: '💨', name: 'Dash',         rar: 0, active: true, cd: 2.5, desc: 'HABILIDAD: impulso veloz de la paleta. (2.5s)' },
  { id: 'a_smash',  icon: '☄️', name: 'Remate',       rar: 1, active: true, cd: 6,   desc: 'HABILIDAD: tu próximo golpe sale disparado. (6s)' },
  { id: 'a_slow',   icon: '🐢', name: 'Cámara lenta', rar: 1, active: true, cd: 8,   desc: 'HABILIDAD: ralentiza todas las bolas 1.6s. (8s)' },
  { id: 'a_freeze', icon: '❄️', name: 'Congelar',     rar: 1, active: true, cd: 9,   desc: 'HABILIDAD: congela al rival 0.8s. (9s)' },
  { id: 'a_wall',   icon: '🧱', name: 'Muralla',      rar: 2, active: true, cd: 12,  desc: 'HABILIDAD: muro en tu portería 2.5s. (12s)' },
];
const CARD = Object.fromEntries(CARDS.map(c => [c.id, c]));
const MODS = [
  { id: 'classic', name: 'Clásico',        desc: 'Sin trucos' },
  { id: 'gravity', name: 'Gravedad',       desc: 'La bola cae hacia abajo' },
  { id: 'wind',    name: 'Vendaval',       desc: 'Ráfagas de viento vertical' },
  { id: 'dark',    name: 'Apagón',         desc: 'La bola se oculta en el centro' },
  { id: 'fast',    name: 'Hipervelocidad', desc: 'Bolas un 35% más rápidas' },
  { id: 'blocks',  name: 'Obstáculos',     desc: 'Bloques móviles en el centro' },
  { id: 'multi',   name: 'Caos',           desc: 'Cada saque lanza 2 bolas' },
  { id: 'tiny',    name: 'Mini',           desc: 'Paletas un 30% más pequeñas' },
  { id: 'warp',    name: 'Portal',         desc: 'Arriba y abajo están conectados' },
];
const COLORS = ['#2de2e6', '#ff3d81'];

/* ---------- state ---------- */
let state = 'title', paused = false, T = 0;
let P = [], balls = [], parts = [], obstacles = [], floats = [];
let mod = MODS[0], roundNum = 0, serveTimer = 0, serveDir = 1, slowT = 0, shake = 0, flash = 0;
let draft = null, endT = 0, lastLoser = -1, winner = null, banner = null;
let hitStop = 0, rings = [], ev = null, nextEv = 15;
const EVENTS = [
  { id: 'spin',   name: 'GIRO TOTAL',  icon: '🔄', dur: 4.5 },
  { id: 'flip',   name: 'VOLTEO',      icon: '🙃', dur: 9 },
  { id: 'tilt',   name: 'INCLINACIÓN', icon: '📐', dur: 8 },
  { id: 'top',    name: 'VISTA AÉREA', icon: '🦅', dur: 8 },
  { id: 'wobble', name: 'MAREO',       icon: '🌊', dur: 8 },
  { id: 'side',   name: 'PERSPECTIVA', icon: '🎥', dur: 8 },
];
function addRing(x, y, color, size = 1) { fxRec(['r', Math.round(x), Math.round(y), color, size]); rings.push({ x, y, color, t: 0, max: 0.55 + 0.2 * size, size }); if (rings.length > 24) rings.shift(); }
const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);
// returns camera modifiers for the current event: yaw (rad), roll (rad), top (0..1), side (0..1)
function eventCam() {
  const r = { yaw: 0, roll: 0, top: 0, side: 0 };
  if (!ev || ev.t < 0 || !(state === 'play' || state === 'serve')) return r;
  const t = ev.t, d = ev.dur, amt = ease(t / 1.0) * ease((d - t) / 1.0);
  switch (ev.id) {
    case 'spin': r.yaw = Math.PI * 2 * ease(t / d); break;
    case 'flip': r.yaw = Math.PI * amt; break;
    case 'tilt': r.roll = ev.sign * 0.5 * amt; break;
    case 'top': r.top = amt; break;
    case 'wobble': r.yaw = Math.sin(t * 2.0) * 0.5 * amt; r.roll = Math.sin(t * 1.3) * 0.18 * amt; break;
    case 'side': r.yaw = ev.sign * (Math.PI / 2) * amt; r.side = amt; break;
  }
  return r;
}

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const L = (p, id) => p.lv[id] || 0;
const rnd = (a, b) => a + Math.random() * (b - a);

function mkPlayer(i) {
  return { i, x: i ? W - 36 : 36, y: H / 2, w: 14, h: 100, speed: 520, vy: 0, score: 0, rounds: 0,
    lv: {}, active: null, cd: 0, cdMax: 1, frozen: 0, dashT: 0, dashDir: 0, wallT: 0, smash: false,
    shield: 0, color: COLORS[i], name: 'JUGADOR ' + (i + 1), hitT: 0 };
}
function recalc() {
  for (const p of P) {
    const o = P[1 - p.i];
    let h = 100 * (1 + 0.22 * L(p, 'long')) * Math.pow(0.88, L(o, 'shrink'));
    if (mod.id === 'tiny') h *= 0.7;
    p.h = clamp(h, 40, 260);
    p.speed = 520 * (1 + 0.18 * L(p, 'fast'));
  }
}
const baseSpeed = () => 400 * (mod.id === 'fast' ? 1.35 : 1);
const maxSpeed = () => 1150 * (mod.id === 'fast' ? 1.15 : 1);

/* ---------- flow ---------- */
function startMatch() {
  P = [mkPlayer(0), mkPlayer(1)];
  roundNum = 0; mod = MODS[0]; winner = null; balls = []; obstacles = []; parts = []; floats = [];
  serveDir = Math.random() < 0.5 ? -1 : 1;
  beginDraft(-1);
  beep(440, 0.1); setTimeout(() => beep(660, 0.12), 90);
}
function rollOptions(p, guarantee) {
  const pool = CARDS.filter(c => c.active ? p.active !== c.id : (L(p, c.id) < c.max && (c.id !== 'cool' || p.active)));
  const opts = [];
  for (let n = 0; n < 3; n++) {
    let cand = pool.filter(c => !opts.includes(c) && (!(guarantee && n === 0) || c.rar >= 1));
    if (!cand.length) cand = pool.filter(c => !opts.includes(c));
    if (!cand.length) break;
    const ws = cand.map(c => RAR[c.rar].w);
    let r = Math.random() * ws.reduce((a, b) => a + b, 0), k = 0;
    while (k < ws.length - 1 && r > ws[k]) { r -= ws[k]; k++; }
    opts.push(cand[k]);
  }
  for (let i = opts.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [opts[i], opts[j]] = [opts[j], opts[i]]; }
  return opts;
}
function beginDraft(loser) {
  NET.draftId++;
  draft = { opts: [rollOptions(P[0], loser === 0), rollOptions(P[1], loser === 1)], sel: [0, 0], done: [false, false], loser, t: 0 };
  state = 'draft';
}
function applyCard(p, c) {
  if (c.active) { p.active = c.id; p.cd = 0; }
  else p.lv[c.id] = L(p, c.id) + 1;
}
function startRound() {
  roundNum++;
  if (roundNum === 1) mod = MODS[0];
  else { const c = MODS.filter(m => m.id !== mod.id); mod = c[Math.random() * c.length | 0]; }
  for (const p of P) {
    p.score = 0; p.y = H / 2; p.shield = L(p, 'shield'); p.cd = 0; p.frozen = 0;
    p.wallT = 0; p.smash = false; p.dashT = 0;
  }

  const sg = new T3.BufferGeometry(); sg.setAttribute('position', new T3.Float32BufferAttribute(sp, 3));

    } else {

        if (dc.spin.visible) { dc.spin.position.set(px3, 0.95, pz3); dc.spin.rotation.set(Math.PI / 2, T * 5, 0); dc.spin.rotation.x = Math.PI / 2 + Math.sin(T * 3) * 0.3; dc.spin.rotation.z = T * 6; }
        dc.crit.visible = !!L(p, 'crit');
        if (dc.crit.visible) { dc.crit.position.set(px3, 0.72, pz3); dc.crit.scale.set(p.w * S, 1, hz); dc.crit.material.opacity = 0.5 + 0.4 * Math.sin(T * 4); }
        const pw = L(p, 'power');
        dc.power.forEach((m, k) => {
          m.visible = pw > 0;
          if (m.visible) { m.position.set(px3, 0.35, pz3 + (k ? 1 : -1) * (hz / 2 + 0.05)); m.scale.set(p.w * S + 0.06 * pw, 0.75, 0.1); m.material.opacity = 0.35 + 0.15 * pw; }
        });
        dc.ready.visible = !!p.active && p.cd <= 0;
        if (dc.ready.visible) { dc.ready.position.set(px3, 1.05 + 0.08 * Math.sin(T * 5), pz3); dc.ready.material.color.set(p.color); }
        o.ice.visible = p.frozen > 0;
        if (o.ice.visible) { o.ice.position.copy(o.m.position); o.ice.scale.set(p.w * S + 0.2, 0.95, p.h * S + 0.2); }
      }
    }
    // balls
    const list = state === 'title' ? [{ x: demo.x, y: demo.y, owner: -1, trail: [], ghost: 0 }] : balls;
    for (let i = 0; i < ballPool.length; i++) {
      const m = ballPool[i], b = list[i], tr = trailPool[i];
      if (!b) { m.visible = false; tr.forEach(t => t.visible = false); continue; }
      const a = state === 'title' ? 1 : ballAlpha(b);
      const cc = b.owner >= 0 && P[b.owner] ? P[b.owner].color : '#ffffff';
      const spd = Math.hypot(b.vx || 0, b.vy || 0);
      const heat = state === 'title' ? 0 : clamp((spd - baseSpeed()) / (maxSpeed() - baseSpeed()), 0, 1.3);
      const hot = heat < 0.5 ? col('#ffffff').lerp(col('#ffd23c'), heat * 2) : col('#ffd23c').lerp(col('#ff3b2f'), Math.min(1, (heat - 0.5) * 2));
      m.visible = true; m.position.set(gx(b.x), BR + 0.02, gz(b.y));
      m.material.opacity = a; m.material.emissive.copy(hot).lerp(col(cc), 0.25); m.material.color.copy(hot);
      m.castShadow = a > 0.5;
      // stretch along velocity, squash on impact
      b.squash = Math.max(0, (b.squash || 0) - dt);
      const st = 1 + 0.55 * Math.min(1, heat), sq = b.squash > 0 ? 0.6 : 1;
      m.rotation.set(0, -Math.atan2(b.vy || 0, b.vx || 1), 0);
      m.scale.set(st * sq, (b.squash > 0 ? 1.25 : 1) / Math.sqrt(st), (b.squash > 0 ? 1.25 : 1) / Math.sqrt(st));
      for (let k = 0; k < tr.length; k++) {
        const t = tr[k], e = b.trail[k];
        if (!e) { t.visible = false; continue; }
        const n = Math.round(5 + 11 * Math.min(1, heat)), start = b.trail.length - n;
        if (k < start) { t.visible = false; continue; }
        const f = (k - start + 1) / n;
        t.visible = true; t.position.set(gx(e.x), BR + 0.02, gz(e.y)); t.scale.setScalar(f * 0.9 + 0.05);
        t.material.color.copy(col(cc)).lerp(hot, heat > 0.2 ? 0.7 : 0.2); t.material.opacity = a * f * (0.3 + 0.25 * Math.min(1, heat));
      }
      if (i === 0) { ballLight.position.set(gx(b.x), 0.8, gz(b.y)); ballLight.intensity = 1.0 * a; ballLight.color.copy(hot); }
    }
    if (!list.length) ballLight.intensity = 0;
    // obstacles
    for (let i = 0; i < obsPool.length; i++) {
      const m = obsPool[i], o = state === 'title' ? null : obstacles[i];
      m.visible = !!o;
      if (o) { m.position.set(gx(o.x + o.w / 2), 0.4, gz(o.y + o.h / 2)); m.scale.set(o.w * S, 0.8, o.h * S); }
    }
    // shock rings
    for (let i = 0; i < ringPool.length; i++) {
      const m = ringPool[i], r = state === 'title' ? null : rings[i];
      m.visible = !!r;
      if (r) {
        const f = r.t / r.max;
        m.position.set(gx(r.x), 0.03, gz(r.y));
        m.scale.setScalar(0.15 + f * 1.3 * r.size);
        m.material.color.set(r.color); m.material.opacity = (1 - f) * 0.8;
      }
    }
    // particles
    const n = Math.min(parts.length, MAXP);
    for (let i = 0; i < MAXP; i++) {
      if (i < n) {
        const q = parts[i], f = clamp(q.life / q.max, 0, 1);
        pPos[i * 3] = gx(q.x); pPos[i * 3 + 1] = q.h; pPos[i * 3 + 2] = gz(q.y);
        tmpC.set(q.color); pCol[i * 3] = tmpC.r * f; pCol[i * 3 + 1] = tmpC.g * f; pCol[i * 3 + 2] = tmpC.b * f;
      } else { pPos[i * 3 + 1] = -50; }
    }
    pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true;
    if (composer) composer.render(); else renderer.render(scene, cam);
  }
  return { render: render3, resize: resize3, project };
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now; T += dt;
  netPoll(now);
  gatherInput();
  if (NET.mode === 'guest') guestUpdate(dt);
  else if (netWaitMsg()) tickFx(dt);
  else update(dt);
  netSend(now);
  render(dt); pressed.clear();
  updateUI();
  requestAnimationFrame(frame);
}
R3 = make3D();
resize();
requestAnimationFrame(frame);
cv.focus();
})();
</script>
